name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run validate:rules
      - run: npm test
      - name: Smoke install + doctor
        run: |
          mkdir -p /tmp/sd-smoke && cd /tmp/sd-smoke
          npm init -y
          npm install "$GITHUB_WORKSPACE"
          npx spec-driven-kit install --allow-anywhere
          npx spec-driven-kit doctor --strict
